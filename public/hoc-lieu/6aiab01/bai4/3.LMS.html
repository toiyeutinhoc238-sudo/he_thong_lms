<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài 4: Mặt tích cực và mặt hạn chế của một số tính năng AI – Học liệu số</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f4f6fa;color:#1e293b;line-height:1.55}
  header{background:#1d4ed8;color:#fff;padding:18px 20px}
  header h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;font-size:14px;opacity:.85}
  nav{display:flex;gap:6px;max-width:760px;margin:16px auto 0;padding:0 16px}
  nav button{flex:1;padding:10px;border:0;border-radius:8px;background:#e2e8f0;font-size:15px;font-weight:600;cursor:pointer;color:#334155}
  nav button.on{background:#1d4ed8;color:#fff}
  main{max-width:760px;margin:12px auto 40px;padding:0 16px}
  .card{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h2{margin:0 0 10px;font-size:17px}
  ul{margin:0;padding-left:20px}
  li{margin-bottom:8px}
  .q{font-weight:600;margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border:2px solid #cbd5e1;border-radius:8px;background:#fff;font-size:15px;cursor:pointer;font-family:inherit}
  .opt:hover{border-color:#60a5fa}
  .opt.pick{border-color:#1d4ed8;background:#eff6ff}
  .opt.ok{border-color:#16a34a;background:#dcfce7}
  .opt.bad{border-color:#dc2626;background:#fee2e2}
  .opt:disabled{cursor:default;color:#1e293b;opacity:1}
  .note{margin-top:8px;padding:10px 12px;border-radius:8px;background:#f1f5f9;font-size:14px}
  .btn{padding:10px 22px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .btn.light{background:#e2e8f0;color:#334155}
  .center{text-align:center}
  .hide{display:none}
  .count{font-size:14px;color:#64748b;margin-bottom:6px}
  .result{font-size:18px;font-weight:700;margin:10px 0}
  .sync{margin:0 0 12px;padding:10px 12px;border-radius:8px;font-size:14px;background:#eff6ff;color:#1e3a8a;text-align:left}
  .sync.ok{background:#dcfce7;color:#14532d}
  .sync.warn{background:#fef3c7;color:#78350f}
</style>
</head>
<body>
<header>
  <h1>Bài 4: Mặt tích cực và mặt hạn chế của một số tính năng AI</h1>
  <p>Tin học 6 – Chuyên đề Trí tuệ nhân tạo</p>
</header>
<nav>
  <button class="on" data-tab="t1">Ghi nhớ</button>
  <button data-tab="t2">Trắc nghiệm</button>
  <button data-tab="t3">Trò chơi</button>
</nav>
<main>
  <section id="t1"><div class="card"><h2>Kiến thức cần nhớ</h2><ul id="notes"></ul></div></section>

  <section id="t2" class="hide">
    <div class="sync hide" id="syncInfo"></div>
    <div id="quiz"></div>
    <div class="center">
      <div id="quizResult" class="result"></div>
      <div class="sync hide" id="syncStatus"></div>
      <button class="btn" id="quizSubmit">Nộp bài</button>
      <button class="btn light hide" id="quizReset">Làm lại</button>
    </div>
  </section>

  <section id="t3" class="hide">
    <div class="card center" id="gStart">
      <h2 id="gTitle"></h2>
      <p id="gIntro"></p>
      <button class="btn" id="gBegin">Bắt đầu</button>
    </div>
    <div class="card hide" id="gPlay">
      <div class="count" id="gCount"></div>
      <div class="q" id="gQ"></div>
      <div id="gOpts"></div>
      <div class="note hide" id="gNote"></div>
      <div class="center" style="margin-top:12px"><button class="btn hide" id="gNext">Câu tiếp theo</button></div>
    </div>
    <div class="card center hide" id="gEnd">
      <div class="result" id="gScore"></div>
      <button class="btn" id="gAgain">Chơi lại</button>
    </div>
  </section>
</main>

<script>
const D = {
 "notes": [
  "Hệ thống gợi ý: đề xuất nội dung đúng sở thích, tiết kiệm thời gian. Hạn chế: thu thập nhiều dữ liệu hành vi, dễ tạo “bong bóng thông tin”.",
  "Nhận diện khuôn mặt, giọng nói: mở khóa nhanh, hỗ trợ người khuyết tật. Hạn chế: có thể nhận diện nhầm, dữ liệu sinh trắc rất nhạy cảm nếu bị lộ.",
  "AI tạo sinh văn bản, hình ảnh: gợi ý ý tưởng, minh họa nhanh. Hạn chế: có thể sai kiến thức, vi phạm bản quyền, làm giảm tư duy độc lập nếu lạm dụng.",
  "Mọi tính năng AI đều có hai mặt. Em cần tận dụng lợi ích và biết cách kiểm soát rủi ro."
 ],
 "quiz": [
  {
   "id": "q1",
   "q": "Hệ thống gợi ý video ghi lại lịch sử xem, thời gian xem, lượt thích của em để làm gì?",
   "o": [
    "Để dự đoán sở thích và đề xuất nội dung phù hợp.",
    "Để tắt máy khi em xem quá lâu.",
    "Để xóa video em không thích.",
    "Để tăng dung lượng bộ nhớ điện thoại."
   ],
   "a": 0,
   "e": "Dữ liệu hành vi được dùng để dự đoán sở thích và gợi ý nội dung."
  },
  {
   "id": "q2",
   "q": "“Bong bóng thông tin” là gì?",
   "o": [
    "Quảng cáo hiện lên dưới dạng bong bóng.",
    "Người dùng chỉ nhìn thấy nội dung giống sở thích cũ nên góc nhìn bị thu hẹp.",
    "Lỗi làm mất dữ liệu trong điện thoại.",
    "Một loại mạng xã hội mới."
   ],
   "a": 1,
   "e": "Bong bóng thông tin làm em ít tiếp cận ý kiến và kiến thức mới."
  },
  {
   "id": "q3",
   "q": "Vì sao dữ liệu khuôn mặt và giọng nói cần được bảo vệ đặc biệt?",
   "o": [
    "Vì chúng chiếm nhiều dung lượng.",
    "Vì chúng luôn do AI tạo ra.",
    "Vì chúng gắn liền với cơ thể, rất khó thay đổi nếu bị lộ.",
    "Vì ai cũng được phép sử dụng chúng."
   ],
   "a": 2,
   "e": "Mật khẩu có thể đổi, còn khuôn mặt và giọng nói thì không."
  },
  {
   "id": "q4",
   "q": "Nếu lạm dụng công cụ AI tạo văn bản, em có thể gặp rủi ro nào?",
   "o": [
    "Máy tính chạy nhanh hơn.",
    "Bài làm chắc chắn đúng hoàn toàn.",
    "Không có rủi ro nào.",
    "Nhận thông tin sai và giảm khả năng tự suy nghĩ."
   ],
   "a": 3,
   "e": "AI có thể sai, em cần kiểm chứng và tự suy nghĩ độc lập."
  },
  {
   "id": "q5",
   "q": "Cách dùng tính năng AI đúng đắn nhất là gì?",
   "o": [
    "Nhận ra cả hai mặt, tận dụng lợi ích và kiểm soát rủi ro.",
    "Tin hoàn toàn vào AI.",
    "Không bao giờ dùng AI.",
    "Chia sẻ mọi dữ liệu để AI hoạt động tốt hơn."
   ],
   "a": 0,
   "e": "Biết cả mặt tích cực và mặt hạn chế giúp em dùng AI an toàn."
  }
 ],
 "gameTitle": "Mặt tích cực hay mặt hạn chế?",
 "gameIntro": "Đọc từng tình huống và chọn đây là mặt tích cực hay mặt hạn chế của AI.",
 "game": [
  {
   "q": "Đề xuất bài giảng, khóa học phù hợp đúng trình độ và nhu cầu học tập của học sinh.",
   "o": [
    "Mặt tích cực",
    "Mặt hạn chế"
   ],
   "a": 0,
   "e": "Giúp tiết kiệm thời gian tìm kiếm và hỗ trợ học tập hiệu quả."
  },
  {
   "q": "Người dùng bị cuốn vào màn hình quá nhiều giờ do video tự động phát nối tiếp liên tục.",
   "o": [
    "Mặt tích cực",
    "Mặt hạn chế"
   ],
   "a": 1,
   "e": "Ảnh hưởng đến sức khỏe, thị lực và quỹ thời gian học tập."
  },
  {
   "q": "Mở khóa điện thoại nhanh chóng bằng nhận diện khuôn mặt mà không cần nhớ mật khẩu dài.",
   "o": [
    "Mặt tích cực",
    "Mặt hạn chế"
   ],
   "a": 0,
   "e": "Mang lại sự thuận tiện, nhanh chóng cho người sử dụng."
  },
  {
   "q": "Tạo ra “bong bóng thông tin”, khiến người dùng chỉ tiếp cận thông tin một chiều, thiếu đa dạng.",
   "o": [
    "Mặt tích cực",
    "Mặt hạn chế"
   ],
   "a": 1,
   "e": "Làm thu hẹp góc nhìn, hạn chế tiếp cận kiến thức mới mẻ."
  },
  {
   "q": "Ứng dụng bản đồ gợi ý tuyến đường thông thoáng dựa trên dữ liệu giao thông thời gian thực.",
   "o": [
    "Mặt tích cực",
    "Mặt hạn chế"
   ],
   "a": 0,
   "e": "Hỗ trợ di chuyển an toàn và tiết kiệm thời gian đi lại."
  },
  {
   "q": "Công cụ tạo sinh văn bản có thể tạo ra thông tin sai lệch hoặc làm giảm tính tự chủ tư duy nếu lạm dụng.",
   "o": [
    "Mặt tích cực",
    "Mặt hạn chế"
   ],
   "a": 1,
   "e": "Cần luôn kiểm chứng thông tin và tự suy nghĩ độc lập."
  }
 ],
 "passScore": 8
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Kết nối với LMS: học liệu chạy trong khung nhúng sẽ gửi bài làm ra trang LMS, máy chủ chấm và lưu điểm
const inLms = window.parent !== window;
const PASS = D.passScore || 8;
function toLms(msg) { if (inLms) window.parent.postMessage(Object.assign({ source: 'hoclieu-6ai' }, msg), '*'); }
function setBox(id, text, cls) {
  const el = $(id);
  el.textContent = text;
  el.className = 'sync' + (cls ? ' ' + cls : '');
}
function showSaved(s) {
  if (!s || !s.loggedIn) {
    setBox('syncInfo', 'Em cần đăng nhập LMS để kết quả được lưu vào sổ điểm.', 'warn');
    return;
  }
  if (!s.attempts) {
    setBox('syncInfo', 'Kết quả bài trắc nghiệm sẽ được lưu vào sổ điểm LMS. Cần đạt từ ' + PASS + '/10 điểm để hoàn thành bài học.');
    return;
  }
  const done = s.bestScore >= PASS;
  setBox('syncInfo', 'Đã làm ' + s.attempts + ' lần. Điểm cao nhất: ' + s.bestScore + '/10. ' +
    (done ? 'Em đã hoàn thành bài học.' : 'Em cần đạt từ ' + PASS + '/10 để hoàn thành.'), done ? 'ok' : 'warn');
}
window.addEventListener('message', e => {
  if (e.source !== window.parent || !e.data || e.data.source !== 'lms-6ai') return;
  const m = e.data;
  if (m.type === 'state') showSaved(m);
  if (m.type === 'quiz-result') {
    if (m.ok) {
      setBox('syncStatus', 'Đã lưu vào sổ điểm: ' + m.score + '/10 (lần ' + m.attempt + '). ' +
        (m.passed ? 'Em đã hoàn thành bài học.' : 'Chưa đạt ' + PASS + '/10, em xem lại giải thích rồi làm lại nhé.'), m.passed ? 'ok' : 'warn');
      showSaved({ loggedIn: true, attempts: m.attempt, bestScore: m.bestScore });
    } else {
      setBox('syncStatus', 'Chưa lưu được kết quả: ' + (m.message || 'lỗi kết nối') + '. Em bấm "Làm lại" và nộp lại khi có mạng.', 'warn');
    }
  }
});
if (inLms) {
  toLms({ type: 'ready' });
} else {
  setBox('syncInfo', 'Em đang mở học liệu ngoài LMS nên kết quả sẽ không được lưu. Hãy mở bài này trong LMS để được ghi điểm.', 'warn');
}
let quizStart = Date.now();

// Tab
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['t1','t2','t3'].forEach(t => $(t).classList.toggle('hide', t !== b.dataset.tab));
});

// Ghi nhớ
$('notes').innerHTML = D.notes.map(n => '<li>' + esc(n) + '</li>').join('');

// Trắc nghiệm
const picked = {};
function drawQuiz() {
  $('quiz').innerHTML = D.quiz.map((q, i) =>
    '<div class="card"><div class="q">Câu ' + (i + 1) + '. ' + esc(q.q) + '</div>' +
    q.o.map((o, j) => '<button class="opt" data-i="' + i + '" data-j="' + j + '">' + 'ABCD'[j] + '. ' + esc(o) + '</button>').join('') +
    '<div class="note hide" id="qn' + i + '"></div></div>').join('');
  document.querySelectorAll('#quiz .opt').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    const i = +b.dataset.i;
    picked[i] = +b.dataset.j;
    document.querySelectorAll('#quiz .opt[data-i="' + i + '"]').forEach(x => x.classList.toggle('pick', x === b));
  });
}
$('quizSubmit').onclick = () => {
  if (Object.keys(picked).length < D.quiz.length && !confirm('Em chưa trả lời hết các câu. Vẫn nộp bài?')) return;
  let right = 0;
  D.quiz.forEach((q, i) => {
    const btns = document.querySelectorAll('#quiz .opt[data-i="' + i + '"]');
    btns.forEach((b, j) => {
      b.disabled = true;
      b.classList.remove('pick');
      if (j === q.a) b.classList.add('ok');
      else if (j === picked[i]) b.classList.add('bad');
    });
    if (picked[i] === q.a) right++;
    const n = $('qn' + i);
    n.textContent = (picked[i] === q.a ? 'Đúng. ' : 'Chưa đúng. ') + q.e;
    n.classList.remove('hide');
  });
  $('quizResult').textContent = 'Em trả lời đúng ' + right + '/' + D.quiz.length + ' câu.';
  $('quizSubmit').classList.add('hide');
  $('quizReset').classList.remove('hide');
  if (inLms) {
    const answers = {};
    D.quiz.forEach((q, i) => { if (picked[i] !== undefined) answers[q.id] = picked[i]; });
    setBox('syncStatus', 'Đang lưu kết quả vào LMS...');
    toLms({ type: 'quiz-submit', answers, durationSeconds: Math.round((Date.now() - quizStart) / 1000) });
  }
};
$('quizReset').onclick = () => {
  for (const k in picked) delete picked[k];
  $('quizResult').textContent = '';
  $('quizSubmit').classList.remove('hide');
  $('quizReset').classList.add('hide');
  $('syncStatus').classList.add('hide');
  quizStart = Date.now();
  drawQuiz();
  window.scrollTo(0, 0);
};
drawQuiz();

// Trò chơi
let gi = 0, gright = 0;
$('gTitle').textContent = D.gameTitle;
$('gIntro').textContent = D.gameIntro;
function show(id) { ['gStart','gPlay','gEnd'].forEach(x => $(x).classList.toggle('hide', x !== id)); }
function gLoad() {
  const g = D.game[gi];
  $('gCount').textContent = 'Câu ' + (gi + 1) + '/' + D.game.length;
  $('gQ').textContent = g.q;
  $('gOpts').innerHTML = g.o.map((o, j) => '<button class="opt" data-j="' + j + '">' + esc(o) + '</button>').join('');
  $('gNote').classList.add('hide');
  $('gNext').classList.add('hide');
  $('gNext').textContent = gi === D.game.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';
  document.querySelectorAll('#gOpts .opt').forEach(b => b.onclick = () => {
    const j = +b.dataset.j;
    document.querySelectorAll('#gOpts .opt').forEach((x, k) => {
      x.disabled = true;
      if (k === g.a) x.classList.add('ok');
      else if (k === j) x.classList.add('bad');
    });
    if (j === g.a) gright++;
    const n = $('gNote');
    n.textContent = (j === g.a ? 'Đúng. ' : 'Chưa đúng. ') + ((g.f && g.f[j]) || g.e);
    n.classList.remove('hide');
    $('gNext').classList.remove('hide');
  });
}
$('gBegin').onclick = () => { gi = 0; gright = 0; show('gPlay'); gLoad(); };
$('gNext').onclick = () => {
  gi++;
  if (gi < D.game.length) gLoad();
  else {
    $('gScore').textContent = 'Em trả lời đúng ' + gright + '/' + D.game.length + ' câu.';
    show('gEnd');
    toLms({ type: 'game-finish', correct: gright, total: D.game.length });
  }
};
$('gAgain').onclick = () => { show('gStart'); };
</script>
</body>
</html>
